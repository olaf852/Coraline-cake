<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Other Bakery</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stars" id="stars" aria-hidden="true"></div>
<main>
  <h1>The Other Bakery</h1>
  <p class="sub">Remember the recipe. The door won't show it twice.</p>
  <div class="hud"><span id="sc">Score 0</span><span id="rd">Round 1</span><span id="lv">Lives ♥♥♥</span></div>

  <div class="start-wrap" id="intro">
    <section class="panel center">
      <h2>Welcome through the little door</h2>
      <p>Study each recipe before it vanishes, then rebuild the cake from memory. One wrong ingredient and the cake collapses. Three collapses and you're stuck here.</p>
      <button class="btn" id="start">Start baking</button>
    </section>
  </div>

  <section class="panel hide" id="game">
    <h2 id="phase"></h2>
    <div class="recipe" id="recipe"></div>
    <div class="bar" id="barWrap"><div id="bar"></div></div>
    <div class="stage"><div class="cake" id="cake"></div></div>
    <div id="build" class="hide">
      <div id="rows"></div>
      <div class="center"><button class="btn" id="bake" disabled>Bake the cake</button></div>
    </div>
    <div id="result" class="hide center">
      <p class="res" id="resTxt"></p>
      <div class="cmp" id="cmp"></div>
      <button class="btn" id="next">Next recipe</button>
    </div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>

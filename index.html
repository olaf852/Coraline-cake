<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الباستري </title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stars" id="stars" aria-hidden="true"></div>
<main>
  <h1>أنتَ الباستري</h1>
  <p class="sub">احفظ الوصفة… الباب ما رح يوريك ياها مرتين.</p>

  <!-- الشاشة 1: الاسم -->
  <div class="start-wrap" id="intro">
    <section class="panel center">
      <h2>أهلاً فيك من الباب الصغير</h2>
      <p>عندك ثواني قليلة لتحفظ كل وصفة، وبعدها ركّب الكيكة من ذاكرتك: طوابق، حشوة، كريمة، صوص، رشّات وزينة.</p>
      <label class="field" for="name">شو اسمك؟</label>
      <input id="name" class="input" type="text" maxlength="16" placeholder="اكتب اسمك" autocomplete="off">
      <p class="hint hide" id="nameErr">اكتب اسمك عشان تكمّل.</p>
      <button class="btn" id="start">كمّل</button>
    </section>
  </div>

  <!-- الشاشة 2: الشخصية -->
  <div class="start-wrap hide" id="pickChar">
    <section class="panel center wide">
      <h2 id="charTitle">اختار شخصيتك</h2>
      <div class="chars" id="chars" role="radiogroup" aria-label="الشخصيات"></div>
      <button class="btn" id="choose" disabled>اختيار</button>
    </section>
  </div>

  <!-- الشاشة 3: اللعبة -->
  <div id="gameWrap" class="hide">
    <div class="hud">
      <span class="who"><img id="avatar" alt=""><b id="whoName"></b></span>
      <span id="sc">النقاط 0</span><span id="rd">الجولة 1</span><span id="lv">الأرواح ♥♥♥</span>
    </div>
    <section class="panel" id="game">
      <h2 id="phase"></h2>
      <div class="bar" id="barWrap"><div id="bar"></div></div>
      <div class="stage" id="stage" aria-label="الكيكة ثلاثية الأبعاد، اسحب لتدويرها"></div>
      <p class="tip" id="tip">اسحب الكيكة بإصبعك لتدوّرها</p>
      <div class="recipe" id="recipe"></div>
      <div id="build" class="hide">
        <div class="say"><img id="sayImg" alt=""><p class="hint" id="feedback" aria-live="polite"></p></div>
        <div id="rows"></div>
      </div>
      <div id="result" class="hide center">
        <p class="res" id="resTxt"></p>
        <div class="cmp" id="cmp"></div>
        <button class="btn" id="next">جولة جديدة</button>
      </div>
    </section>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="script.js"></script>
</body>
</html>
